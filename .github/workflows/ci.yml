name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests ../sirraya/api/tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: bash ../sirraya/scripts/link-sirraya-dev.sh
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  playwright:
    runs-on: ubuntu-latest
    needs: web
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/.preview/ci.sqlite
      SESSION_SECRET: ci-only-isolated-session-secret-not-for-production
      GOOGLE_CLIENT_ID: ci-only.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only-provider-placeholder
      FRONTEND_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:8000
      SRS_TEST_COOKIE: ${{ github.workspace }}/.preview/srs-test-cookie.json
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r ../api/requirements.txt
      - name: Prepare isolated migrated API and synthetic learner
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .preview
          python -m alembic upgrade head
          python api/scripts/prepare_srs_test_session.py
      - name: Start isolated API
        working-directory: api
        run: python -m uvicorn main:app --host 127.0.0.1 --port 8000 --no-access-log --log-level warning > ../.preview/api.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: bash ../sirraya/scripts/link-sirraya-dev.sh
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: "true"
